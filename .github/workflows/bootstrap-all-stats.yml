name: Bootstrap All Stats (Goals + Corners + Cards)

on:
  workflow_dispatch: # Manual trigger
  
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 2880 # 48 hours
    
    steps:
      - name: 🚀 Starting Bootstrap
        run: |
          echo "🚀 BOOTSTRAP STARTING"
          echo "⏱️  Estimated time: 36-48 hours"
          echo "📊 Will create ~220,000 documents"
          
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Bootstrap
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VITE_API_FOOTBALL_KEY: ${{ secrets.VITE_API_FOOTBALL_KEY }}
        run: |
          echo "🔄 Starting bootstrap process..."
          node scripts/runBootstrap.js 2>&1 | tee bootstrap.log
          
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bootstrap-logs
          path: bootstrap.log
          
      - name: 📧 Send completion notification
        if: success()
        run: |
          echo "✅ BOOTSTRAP COMPLETE!"
          echo "📊 Check artifacts for full logs"
          
      - name: ❌ Send failure notification
        if: failure()
        run: |
          echo "❌ BOOTSTRAP FAILED"
          echo "📋 Check logs for details"
