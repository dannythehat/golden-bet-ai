name: Run Data Aggregation

on:
  # Allow manual trigger
  workflow_dispatch:
  
  # Run daily at 4 AM UTC
  schedule:
    - cron: '0 4 * * *'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install
          npm install mongodb tsx
      
      - name: Run data aggregation
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VITE_API_FOOTBALL_KEY: ${{ secrets.VITE_API_FOOTBALL_KEY }}
        run: npm run aggregate
      
      - name: Check aggregation status
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run aggregate:status
