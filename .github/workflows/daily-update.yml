name: Daily Board + P&L

# The Gaffer's morning routine, automated:
#   1. SETTLE yesterday's locked bet against the real result -> append to the P&L ledger.
#   2. REGENERATE today's value board from fresh fixtures / form / odds.
#   3. COMMIT changed data to main. The separate Deploy to Cloudflare Pages
#      workflow publishes that commit once, avoiding duplicate deployments.

on:
  schedule:
    # Three early-morning slots are retained as the existing scheduler fallback.
    - cron: '45 2 * * *'
    - cron: '35 3 * * *'
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      settle_dates:
        description: 'Dates to settle/backfill (e.g. "2026-07-02 2026-07-03"). Blank = yesterday.'
        required: false
        default: ''
      skip_generate:
        description: 'Skip regenerating the board (settle only).'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Settle the P&L ledger
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS }}
        run: node scripts/settle.mjs ${{ github.event.inputs.settle_dates }}

      - name: Regenerate the value board
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS }}
        run: python3 scripts/generate-board.py

      - name: Commit updates
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/pnlLedger.json src/data/formTablesData.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — an earlier run already did today's work."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily board + P&L update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram report
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          if [ "$STATUS" = "success" ]; then
            if [ "$COMMITTED" != "true" ]; then exit 0; fi
            MSG="✅ Morning data update committed — production deploy workflow will publish it"
          else
            MSG="🚨 MORNING UPDATE FAILED — today's data may be stale. Check GitHub Actions → Daily Board + P&L."
          fi
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" -d text="$MSG" >/dev/null || true
