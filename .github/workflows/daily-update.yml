name: Daily Board + P&L

# The Gaffer's morning routine, automated:
#   1. SETTLE yesterday's locked bet against the real result → append to the P&L
#      ledger (with the Gaffer's stored word on the day).
#   2. REGENERATE today's value board from fresh fixtures / form / odds.
#   3. BUILD + DEPLOY to Cloudflare Pages — the project is a direct-upload
#      project (no git integration), so committing alone does NOT update the
#      live site. The deploy step here is what keeps thefootyoracle.com fresh.

on:
  schedule:
    # 03:10 UTC — yesterday's fixtures are final everywhere, and the board is
    # fresh before Europe wakes up (06:10 in Sofia, 04:10 in London).
    - cron: '10 3 * * *'
  workflow_dispatch:
    inputs:
      settle_dates:
        description: 'Dates to settle/backfill (e.g. "2026-07-02 2026-07-03"). Blank = yesterday.'
        required: false
        default: ''
      skip_generate:
        description: 'Skip regenerating the board (settle only).'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # Settle FIRST — while yesterday's locked picks are still in the board file.
      - name: Settle the P&L ledger
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS }}
        run: node scripts/settle.mjs ${{ github.event.inputs.settle_dates }}

      # Then refresh the board (merges — keeps yesterday for the next settle).
      - name: Regenerate the value board
        if: ${{ github.event.inputs.skip_generate != 'true' }}
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS }}
        run: python3 scripts/generate-board.py

      - name: Commit updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/pnlLedger.json src/data/formTablesData.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "🤖 Daily board + P&L update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # The live site is a direct-upload Pages project — deploy or it stays stale.
      - name: Build the site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — data was committed but the LIVE SITE WAS NOT UPDATED."
            exit 1
          fi
          npx wrangler@3 pages deploy dist --project-name=golden-bet-ai --branch=main

      # Morning report straight to the boss's pocket (skips if secrets unset).
      - name: Telegram report
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          if [ "$STATUS" = "success" ]; then
            MSG="✅ Morning update done — yesterday settled, today's board live on thefootyoracle.com"
          else
            MSG="🚨 MORNING UPDATE FAILED — the site may be showing stale picks. Check GitHub Actions → Daily Board + P&L."
          fi
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" -d text="$MSG" >/dev/null || true
