name: Settle Daily P&L

# Every morning, settle the previous day's locked bet (top-2 value = double,
# next-3 = treble) against the real result and append it to the tracked ledger
# (src/data/pnlLedger.json). Committing to main triggers the auto-deploy, so the
# site's P&L updates itself with no hand-editing.

on:
  schedule:
    # 05:00 UTC — the prior day's fixtures (Nordic / Asian leagues) are all final by now.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Space-separated dates to settle/backfill (e.g. "2026-07-02 2026-07-03"). Blank = yesterday.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Settle the ledger
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
        run: node scripts/settle.mjs ${{ github.event.inputs.dates }}

      - name: Commit updated ledger
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/pnlLedger.json
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "🤖 Settle P&L ledger [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
