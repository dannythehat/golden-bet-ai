name: Fetch Real Stats Daily

on:
  schedule:
    # Run daily at 4:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      quick_mode:
        description: 'Quick mode (fewer teams per league)'
        required: false
        default: 'false'

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch real stats from API-Football
        env:
          VITE_API_FOOTBALL_KEY: ${{ secrets.VITE_API_FOOTBALL_KEY }}
        run: |
          if [ "${{ github.event.inputs.quick_mode }}" == "true" ]; then
            npm run fetch-stats:quick
          else
            npm run fetch-stats
          fi
      
      - name: Commit and push updated cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cache/stats-cache.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update stats cache with real API data [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
      
      - name: Summary
        run: |
          echo "✅ Stats cache updated successfully!"
          echo "📊 Cache file size: $(du -h cache/stats-cache.json | cut -f1)"
          echo "🕐 Next run: Tomorrow at 4:00 AM UTC"
