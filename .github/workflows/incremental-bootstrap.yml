name: Incremental Bootstrap (50 teams per run)

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours = 200 teams/day = 55 days to complete
    
jobs:
  incremental-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Only 30 minutes needed per run
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install mongoose node-fetch
        
      - name: Run Incremental Bootstrap
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VITE_API_FOOTBALL_KEY: ${{ secrets.VITE_API_FOOTBALL_KEY }}
        run: node scripts/incrementalBootstrap.js
