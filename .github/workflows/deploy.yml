name: Deploy to Cloudflare Pages

# Every site-affecting push to main builds the site and deploys it to the
# Cloudflare Pages project "golden-bet-ai" on the production (main) branch.
# Workflow-only maintenance does not need a production deployment.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

# Prevent overlapping deploys from racing; a newer push cancels an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 964cd8ee33ecf4e58a581f4806cd0cb5
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 964cd8ee33ecf4e58a581f4806cd0cb5
          command: pages deploy dist --project-name=golden-bet-ai --branch=main
