name: Deploy to Cloudflare Pages

# Every push to main builds the site and deploys it to the Cloudflare Pages
# project "golden-bet-ai" on the production (main) branch — which is what the
# custom domain thefootyoracle.com serves. Also runnable manually from the
# Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys from racing; a newer push cancels an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # Account ID is not a secret (it appears in dashboard URLs); the only repo
        # secret needed is CLOUDFLARE_API_TOKEN. Passed via both the action input
        # and env so wrangler always sees it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 964cd8ee33ecf4e58a581f4806cd0cb5
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 964cd8ee33ecf4e58a581f4806cd0cb5
          command: pages deploy dist --project-name=golden-bet-ai --branch=main
