          "acceptedAnswer": {
            "@type": "Answer",

          "@type": "Question",

            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "What betting markets does The Footy Oracle cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We cover Over 2.5 Goals, Over 8.5 Corners, Over 3.5 Cards, Bet Builder combinations, and ACCA Delight accumulators. Each market is backed by ML model confidence scores and historical performance tracking."
          }
        },
        {
          "@type": "Question",
          "name": "Is The Footy Oracle free to use?",

            "@type": "Answer",

          }
        }
